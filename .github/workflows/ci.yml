name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGS_AI_SKIP_STARTUP: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai
      CGS_INTERNAL_SERVICE_KEY: ci-only-internal-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: pytest
